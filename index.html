<header>
<h1>日本語 文法ノート</h1>
<p class="sub">Chapters 15, 16 and 17: study the patterns, then drill them.</p>
</header>

<main id="app"></main>
<script>
const P=(t,n,ex,extra)=>({t,n,ex,extra});
const C15=[
P("1. Asking which of two is more","Compare two items and ask which has more of a quality.","A と B と どちらのほうが [Adj] ですか",[["中野と新中野と どちらのほうが近いですか。","Which is closer, Nakano or Shin-Nakano?"],["東京と大阪と どちらのほうが人口が多いですか。","Which has a larger population, Tokyo or Osaka?"]]),
P("2. Answering with emphasis","ずっと means “much more”; より means “than”.","A のほうが (B より) [Adj] です / A のほうが ずっと [Adj] です",[["中野のほうが新中野より近いです。","Nakano is closer than Shin-Nakano."],["サッカーのほうが ずっと人気があります。","Soccer is by far more popular."]]),
P("3. Equal comparison","Both items rate about the same.","A も B も 同じぐらい [Adj] です / どちらも同じぐらい [Adj] です",[["新宿も渋谷も同じぐらいにぎやかです。","Shinjuku and Shibuya are about equally lively."],["日本語と英語はどちらも同じぐらい難しいです。","Japanese and English are about equally difficult."]]),
P("4. Too much: ～すぎます","Goes beyond the acceptable limit (usually bad). い-adj: drop い. な-adj: base. Verb: masu-stem.","い-Adj(−い) / な-Adj / Verb(ます-stem) + すぎます",[["このアパートは駅から遠すぎます。","This apartment is too far from the station."],["お酒を飲みすぎると、頭が痛くなります。","If I drink too much, I get a headache."]]),
P("5. Asking for the top one","Pick the number one among three or more.","[Group] の中で [Q-word] がいちばん [Adj] ですか",[["スポーツの中で何がいちばん好きですか。","Among sports, what do you like most?"],["一年の中でいつがいちばん雨が多いですか。","When does it rain the most in a year?"]]),
P("6. Describing an attribute (は…が…)","Pick out one feature of the topic and evaluate it.","[Topic] は [Feature] が [Adj] です",[["この中野の部屋は台所が広いです。","As for this Nakano room, the kitchen is spacious."],["このアパートは家賃が安いです。","As for this apartment, the rent is cheap."]]),
P("7. A is more than B (より)","State directly that A has more of a quality than B.","A は B より [Adj] です",[["弟は私より3歳年下です。","My younger brother is 3 years younger than me."],["中国は日本よりずっと広いですが、寒いです。","China is much larger than Japan, but it is cold."]]),
P("8. The most (いちばん)","A ranks highest in its group.","A は [Group] の中で いちばん [Adj] です",[["このカメラはこのみっつの中でいちばん軽いです。","This camera is the lightest of these three."],["琵琶湖は日本でいちばん大きい湖です。","Lake Biwa is the largest lake in Japan."]])
];
const C16=[
P("1. Explaining with んです","Gives a reason, adds emphasis or asks for an explanation. Plain verb + んです; な-adj / noun + なんです.","Verb(plain) + んです / な-Adj・Noun + なんです",[["今日は母の誕生日なんです。","Today is my mother’s birthday."],["大変なんです。","It’s tough."]]),
P("2. Turning verbs into nouns: こと","Plain verb + こと. Use for hobbies, ability and experience.","Verb(plain) + こと",[["私の趣味は映画を見ることです。","My hobby is watching movies."],["母の料理を食べることができればいいです。","It would be good if I could eat my mother’s cooking."],["この旅行でいちばん楽しかったことは何ですか。","What was the most fun thing on this trip?"]]),
P("3. Requests: ～てください / ～ないでください","て-form + ください asks someone to do it. ない-form + でください asks them not to.","V(て) + ください / V(ない) + でください",[["シャワーを浴びてください。","Please take a shower."],["ここにごみを捨てないでください。","Please do not throw trash here."],["芝生に入らないでください。","Please do not enter the lawn."]]),
P("4. Timing: 前に / 後で / まで","前に: dictionary form. 後で: た-form. まで: dictionary form.","V(dict) + 前に / V(た) + 後で / V(dict) + まで",[["ごはんを食べる前に、飲んでください。","Please drink it before eating."],["ごはんを食べた後で、歯をみがきます。","After eating, I brush my teeth."],["チンさんが来るまで喫茶店にいます。","I’ll be at the café until Mr. Chin comes."]]),
P("5. Explaining the past: ～たんです","た-form + んです explains what happened and why you are in this situation now.","V(た) + んです",[["どうしたんですか。","What happened?"],["階段から落ちたんです。","I fell down the stairs."],["冷やしたんですが、また痛いんです。","I cooled it, but it hurts again."]])
];
const C19=[
P("1. Try doing it: ～てみます","Do something to see what it is like (try on, try eating, try out). て-form + みます.","V(て) + みます / みてもいいですか / みてください",[["このジーパンをはいてみます。","I’ll try on these jeans."],["この靴、はいてみてもいいですか。","May I try these shoes on?"],["いなりずしです。食べてみてください。","It’s inari sushi. Please try it."],["私も今度やってみたいです。","I want to try it next time too."]]),
P("2. Make something ~: ～くします / ～にします","Change a state on purpose. い-adj: drop い + く + する. な-adj: + に + する.","い-Adj(−い) + くする / な-Adj + にする",[["少し短くしてください。","Please make it a little shorter."],["エアコンを弱くしましょう。","Let’s turn the air-con down."],["テーブルの上をきれいにしてください。","Please clean the table."],["前髪を短くしてください。","Please make my bangs shorter."]]),
P("3. Oops, I did it: ～てしまいました","Something happened by accident, or you finished it completely. Often a regret. Casual: ～ちゃいました.","V(て) + しまいました / しまったんです",[["子供がいなくなってしまいました。","My child has gone missing."],["部屋のかぎをなくしてしまったんです。","I lost my room key."],["お皿を割ってしまいました。","I accidentally broke a plate."],["昨日は財布を忘れてしまったので、友達にお金を借りました。","I forgot my wallet yesterday, so I borrowed money from a friend."]]),
P("4. While: ～間 / ～間に","間: the action lasts the whole time. 間に: something happens at some point during that time.","V(ている) / Noun の + 間、… / 間に、…",[["私が試着している間、ここで待っていてください。","Please wait here while I try clothes on."],["私が試着している間に、いなくなってしまったんです。","While I was trying them on, he went missing."],["電車に乗っている間、ずっと音楽を聞いていました。","I listened to music the whole time on the train."],["買い物をしている間に、財布を落としてしまいました。","I dropped my wallet while shopping."],["夏休みの間に、北海道へ行きます。","I’ll go to Hokkaido during summer vacation."]]),
P("5. Wearing: ～ています","Wearing verbs use ています for the state. 着る (shirt, dress), かぶる (hat), かける (glasses), する (necklace, contacts), はく (pants, shoes).","Item を + 着て / かぶって / かけて / して / はいて + います",[["赤いTシャツを着ています。","He’s wearing a red T-shirt."],["白い帽子をかぶっていますよ。","She’s wearing a white hat."],["今日はコンタクトレンズをしているんです。","I’m wearing contact lenses today."],["白いワンピースを着て、ネックレスをしている人です。","It’s the person wearing a white dress and a necklace."]]),
P("6. Giving directions: ～と","Verb (dictionary) + と = when you do this, this follows. Polite: ございます.","V(dict) + と、… があります / ございます",[["ここをまっすぐ行くと、エスカレーターがございます。","If you go straight from here, there is an escalator."],["右に曲がると、左側に帽子売場がございます。","If you turn right, the hat department is on the left."]])
];
const V=[["働く","はたらく","働ける","働けない","G1"],["話す","はなす","話せる","話せない","G1"],["泳ぐ","およぐ","泳げる","泳げない","G1"],["選ぶ","えらぶ","選べる","選べない","G1"],["弾く","ひく","弾ける","弾けない","G1"],["覚える","おぼえる","覚えられる","覚えられない","G2"],["起きる","おきる","起きられる","起きられない","G2"],["食べる","たべる","食べられる","食べられない","G2"],["する","","できる","できない","G3"],["来る","くる","来られる","来られない","G3"]];
const E17=[["ピアノが弾けます。","I can play the piano."],["漢字が読めますか。","Can you read Kanji?"],["車の運転ができます。","I can drive a car."],["自転車に乗れます。","I can ride a bicycle."],["明日来られます。","I can come tomorrow."],["刺身が食べられません。","I cannot eat sashimi."],["忙しくて、どこへも行けません。","I’m busy and can’t go anywhere."],["難しくて覚えられません。","It’s difficult, so I can’t remember it."],["荷物が多くて、持てません。","There are many bags, so I can’t carry them."],["お酒が飲めません。","I cannot drink alcohol."],["週3日以上できる方","Someone who can do 3+ days a week"],["日本語が話せる人","A person who can speak Japanese"],["泳ぐことができない人","A person who cannot swim"]];
const M19=[
["Form: て-form + みる (みます / みて / みたい). Literally “do it and see”.","Use it for things you haven’t done yet: trying on clothes, tasting food, trying a new hobby.","Ask permission: ～てみてもいいですか (May I try…?). Invite: ～てみてください (Please try…).","Past: ～てみました = I tried it (and here’s what I found).","はく is for the legs and feet (jeans, skirts, shoes): はいてみます."],
["い-adj: 大きい → 大きく + する. な-adj: きれい → きれい + にする.","Noun を + adj + する means someone changes it on purpose.","Compare Ch. 12: ～くなる / ～になる = it changes by itself. 高くなります (it gets high) vs 高くします (I make it high).","Requests: ～くしてください / ～にしてください. Suggestions: ～くしましょう.","Exception: いい → よくします."],
["Two meanings: (1) an accident or regret: なくしてしまいました = I lost it, unfortunately. (2) finishing completely: ぜんぶ食べてしまいました = I ate it all.","Explaining trouble: ～てしまったんです (ん adds explanation, like Ch. 16).","Reason: ～てしまったので、… = because I (unfortunately) …","Casual speech: ～ちゃいました (落としちゃいました). Both mean the same.","いなくなる = go missing (いる → いなくなる)."],
["Before 間: a verb in ている form (試着している間) or a noun + の (夏休みの間).","間 = the state lasts the whole time. ずっと fits well: ずっと音楽を聞いていました.","間に = one event happens at some point inside that time: 財布を落としてしまいました.","Tip: if the action cannot last (落とす, いなくなる, 食べた) use 間に.","The two parts can have different subjects: 弟がゲームをしている間に、僕はケーキを食べました."],
["ています here describes a state: 着ています = is wearing. 着ます = puts on.","Verb by item: 着る (shirt, dress, kimono) · はく (pants, skirt, shoes) · かぶる (hat) · かける (glasses) · する (necklace, watch, contacts).","Not wearing: ～ていません (めがねをかけていません).","Describe a person: [wearing…] + 人 (白いワンピースを着ている人).","Join items with て-form: ワンピースを着て、ネックレスをしています."],
["V (dictionary) + と: when you do A, B naturally follows. Perfect for directions.","Direction words: まっすぐ行く (go straight) · 右に曲がる (turn right) · 左に曲がる (turn left) · 右側 / 左側 (right / left side).","The second half states what you will find. It isn’t used for requests or orders.","ございます is the very polite あります, used by shop staff.","いらっしゃってください = please come (honorific of 来る)."]];
