<body>
<header>
<h1>日本語 文法ノート</h1>
<p class="sub">Chapters 15, 16 and 17: study the patterns, then drill them.</p><p class="sub"><button id="fb" onclick="furi=!furi;render()"></button></p>
<nav id="nav" role="tablist"></nav>
</header>
<main id="app"></main>
<script>
const P=(t,n,ex,extra)=>({t,n,ex,extra});
const C15=[
P("1. Asking which of two is more","Compare two items and ask which has more of a quality.","A と B と どちらのほうが [Adj] ですか",[["中野と新中野と どちらのほうが近いですか。","Which is closer, Nakano or Shin-Nakano?"],["東京と大阪と どちらのほうが人口が多いですか。","Which has a larger population, Tokyo or Osaka?"]]),
P("2. Answering with emphasis","ずっと means “much more”; より means “than”.","A のほうが (B より) [Adj] です / A のほうが ずっと [Adj] です",[["中野のほうが新中野より近いです。","Nakano is closer than Shin-Nakano."],["サッカーのほうが ずっと人気があります。","Soccer is by far more popular."]]),
P("3. Equal comparison","Both items rate about the same.","A も B も 同じぐらい [Adj] です / どちらも同じぐらい [Adj] です",[["新宿も渋谷も同じぐらいにぎやかです。","Shinjuku and Shibuya are about equally lively."],["日本語と英語はどちらも同じぐらい難しいです。","Japanese and English are about equally difficult."]]),
P("4. Too much: ～すぎます","Goes beyond the acceptable limit (usually bad). い-adj: drop い. な-adj: base. Verb: masu-stem.","い-Adj(−い) / な-Adj / Verb(ます-stem) + すぎます",[["このアパートは駅から遠すぎます。","This apartment is too far from the station."],["お酒を飲みすぎると、頭が痛くなります。","If I drink too much, I get a headache."]]),
P("5. Asking for the top one","Pick the number one among three or more.","[Group] の中で [Q-word] がいちばん [Adj] ですか",[["スポーツの中で何がいちばん好きですか。","Among sports, what do you like most?"],["一年の中でいつがいちばん雨が多いですか。","When does it rain the most in a year?"]]),
P("6. Describing an attribute (は…が…)","Pick out one feature of the topic and evaluate it.","[Topic] は [Feature] が [Adj] です",[["この中野の部屋は台所が広いです。","As for this Nakano room, the kitchen is spacious."],["このアパートは家賃が安いです。","As for this apartment, the rent is cheap."]]),
P("7. A is more than B (より)","State directly that A has more of a quality than B.","A は B より [Adj] です",[["弟は私より3歳年下です。","My younger brother is 3 years younger than me."],["中国は日本よりずっと広いですが、寒いです。","China is much larger than Japan, but it is cold."]]),
P("8. The most (いちばん)","A ranks highest in its group.","A は [Group] の中で いちばん [Adj] です",[["このカメラはこのみっつの中でいちばん軽いです。","This camera is the lightest of these three."],["琵琶湖は日本でいちばん大きい湖です。","Lake Biwa is the largest lake in Japan."]])
];
const C16=[
P("1. Explaining with んです","Gives a reason, adds emphasis or asks for an explanation. Plain verb + んです; な-adj / noun + なんです.","Verb(plain) + んです / な-Adj・Noun + なんです",[["今日は母の誕生日なんです。","Today is my mother’s birthday."],["大変なんです。","It’s tough."]]),
P("2. Turning verbs into nouns: こと","Plain verb + こと. Use for hobbies, ability and experience.","Verb(plain) + こと",[["私の趣味は映画を見ることです。","My hobby is watching movies."],["母の料理を食べることができればいいです。","It would be good if I could eat my mother’s cooking."],["この旅行でいちばん楽しかったことは何ですか。","What was the most fun thing on this trip?"]]),
P("3. Requests: ～てください / ～ないでください","て-form + ください asks someone to do it. ない-form + でください asks them not to.","V(て) + ください / V(ない) + でください",[["シャワーを浴びてください。","Please take a shower."],["ここにごみを捨てないでください。","Please do not throw trash here."],["芝生に入らないでください。","Please do not enter the lawn."]]),
P("4. Timing: 前に / 後で / まで","前に: dictionary form. 後で: た-form. まで: dictionary form.","V(dict) + 前に / V(た) + 後で / V(dict) + まで",[["ごはんを食べる前に、飲んでください。","Please drink it before eating."],["ごはんを食べた後で、歯をみがきます。","After eating, I brush my teeth."],["チンさんが来るまで喫茶店にいます。","I’ll be at the café until Mr. Chin comes."]]),
P("5. Explaining the past: ～たんです","た-form + んです explains what happened and why you are in this situation now.","V(た) + んです",[["どうしたんですか。","What happened?"],["階段から落ちたんです。","I fell down the stairs."],["冷やしたんですが、また痛いんです。","I cooled it, but it hurts again."]])
];
const V=[["働く","はたらく","働ける","働けない","G1"],["話す","はなす","話せる","話せない","G1"],["泳ぐ","およぐ","泳げる","泳げない","G1"],["選ぶ","えらぶ","選べる","選べない","G1"],["弾く","ひく","弾ける","弾けない","G1"],["覚える","おぼえる","覚えられる","覚えられない","G2"],["起きる","おきる","起きられる","起きられない","G2"],["食べる","たべる","食べられる","食べられない","G2"],["する","","できる","できない","G3"],["来る","くる","来られる","来られない","G3"]];
const E17=[["ピアノが弾けます。","I can play the piano."],["漢字が読めますか。","Can you read Kanji?"],["車の運転ができます。","I can drive a car."],["自転車に乗れます。","I can ride a bicycle."],["明日来られます。","I can come tomorrow."],["刺身が食べられません。","I cannot eat sashimi."],["忙しくて、どこへも行けません。","I’m busy and can’t go anywhere."],["難しくて覚えられません。","It’s difficult, so I can’t remember it."],["荷物が多くて、持てません。","There are many bags, so I can’t carry them."],["お酒が飲めません。","I cannot drink alcohol."],["週3日以上できる方","Someone who can do 3+ days a week"],["日本語が話せる人","A person who can speak Japanese"],["泳ぐことができない人","A person who cannot swim"]];
const ALL=[...C15,...C16].flatMap(p=>p.ex).concat(E17);
const tabs=[["c15","Ch. 15"],["c16","Ch. 16"],["c17","Ch. 17"],["drill","Drill"],["mock","Mock Test"]];
let tab="c15",hide=false,furi=true,mode="mc",sc={r:0,n:0},cur=null,fcI=0,fcShow=false;
const $=s=>document.querySelector(s);
const sh=a=>[...a].sort(()=>Math.random()-.5);
function nav(){$("#nav").innerHTML=tabs.map(([k,l])=>`<button role="tab" data-k="${k}" aria-selected="${k===tab}" onclick="go('${k}')">${l}</button>`).join("")}
function go(k){tab=k;render()}
function exs(a){return a.map(([j,e])=>`<div class="ex" onclick="this.classList.toggle('on')"><div class="jp">${j}</div><div class="en">${e}</div></div>`).join("")}
const EM=[["⚖️","💪","🤝","🍰","🏆","🔍","📏","👑"],["💬","📦","🙏","⏰","📖"]];
function cards(list,title,sub,em){return `<h2 style="margin:6px 0 2px">${title}</h2><p class="note">${sub}</p>`+tools()+`<div class="${hide?'hide-en':''}">`+list.map((p,i)=>`<section class="card"><h2><span class="em">${EM[em][i]}</span>${p.t}</h2><p class="note">${p.n}</p><code class="pat">${p.ex}</code>${exs(p.extra)}</section>`).join("")+`</div>`}
function tools(){return `<div class="tools"><span>${hide?"Tap a sentence to reveal English":"Study tools"}</span><span><button onclick="hide=!hide;render()">${hide?"Show English":"Hide English"}</button><button onclick="furi=!furi;render()">${furi?"Hide Furigana":"Show Furigana"}</button></span></div>`}
function c17(){
const rows=V.map(v=>`<tr><td>${v[0]}</td><td>${v[2]}</td><td>${v[3]}</td><td><span class="g g${v[4][1]}">${v[4]}</span></td></tr>`).join("");
return `<h2 style="margin:6px 0 2px">第17課 可能形</h2><p class="note">The potential form says you can do something, or that circumstances allow it.</p>
<section class="card"><h2><span class="em">🔧</span>How to form it</h2>
<p><b>Group 1:</b> change the final <mark>う</mark>-row sound to the <mark>え</mark>-row and add る. 話す → 話せる</p>
<p><b>Group 2:</b> drop る and add <mark>られる</mark>. 食べる → 食べられる</p>
<p><b>Group 3:</b> する → <mark>できる</mark>; 来る → <mark>来られる</mark></p>
<p>Negative: swap る for ない. 読める → 読めない</p>
<div class="tw"><table><tr><th>Dictionary</th><th>Affirmative</th><th>Negative</th><th>Group</th></tr>${rows}</table></div></section>
<section class="card"><h2><span class="em">🔄</span>Particle change: を → が</h2><p class="note">The direct object usually takes が with the potential form.</p>
<div class="ex"><div class="jp">中国語を話します。</div></div><div class="ex"><div class="jp">中国語<mark>が</mark>話せます。</div><div class="en">I can speak Chinese.</div></div></section>
<section class="card"><h2><span class="em">✨</span>Examples</h2>${tools()}<div class="${hide?'hide-en':''}">${exs(E17)}</div></section>
<section class="card"><h2><span class="em">🧩</span>Modifying nouns</h2><code class="pat">Potential verb (plain) + Noun</code><p class="note">日本語が話せる人 · 来週から始められる方 · ピアノが弾ける方</p></section>`}
function drill(){
const m=`<div class="modes"><button class="${mode==='mc'?'on':''}" onclick="mode='mc';cur=null;render()">Potential quiz</button><button class="${mode==='fc'?'on':''}" onclick="mode='fc';render()">Flashcards</button></div>`;
if(mode==="fc"){const [j,e]=ALL[fcI];return m+`<div class="card fc" onclick="fcShow=!fcShow;render()"><div class="jp">${j}</div><div class="en note">${fcShow?e:"Tap to reveal the meaning"}</div></div><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="fcI=(fcI+ALL.length-1)%ALL.length;fcShow=false;render()">Back</button><button class="btn" style="flex:1" onclick="fcI=Math.floor(Math.random()*ALL.length);fcShow=false;render()">Random</button><button class="btn" style="flex:1" onclick="fcI=(fcI+1)%ALL.length;fcShow=false;render()">Next</button></div><p class="note">${fcI+1} of ${ALL.length}</p>`}
if(!cur){const v=V[Math.floor(Math.random()*V.length)],neg=Math.random()<.5,ans=v[neg?3:2];
const wrong=sh(V.flatMap(x=>[x[2],x[3]]).filter(x=>x!==ans&&x!==v[0])).slice(0,3);
const dist=[neg?v[2]:v[3],...wrong].filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
cur={v,neg,ans,opts:sh([ans,...dist]),done:null}}
const c=cur;
return m+`<div class="card"><p class="note">Give the ${c.neg?"negative":"affirmative"} potential form (${c.v[4]}).</p><div class="q">${c.v[0]}</div>
<div class="opts">${c.opts.map(o=>`<button class="${c.done?(o===c.ans?'ok':(o===c.done?'bad':'')):''}" ${c.done?'disabled':''} onclick="pick('${o}')">${o}</button>`).join("")}</div>
${c.done?`<p class="q">${c.done===c.ans?"🎉 Correct!":"😅 Answer: "+c.ans}</p><button class="btn" onclick="cur=null;render()">Next question</button>`:""}<p class="score">Score: ${sc.r} / ${sc.n}</p></div>`}
function pick(o){if(cur.done)return;cur.done=o;sc.n++;if(o===cur.ans)sc.r++;render()}

const B={
c15:[["東京と大阪と（　）のほうが人口が多いですか。","どちら",["どれ","だれ","いつ"],"Comparing two items uses どちらのほうが."],
["中野のほうが新中野（　）近いです。","より",["から","まで","で"],"より marks the thing compared against (than)."],
["この部屋はちょっと狭（　）ますね。","すぎ",["くて","すぎる","すき"],"Adjective stem + すぎます = too ~."],
["スポーツの中で何（　）いちばん好きですか。","が",["を","に","へ"],"Superlative questions: Q-word + が + いちばん."],
["日本語と英語は（　）同じぐらい難しいです。","どちらも",["どれが","どちらに","だれも"],"Equal comparison: どちらも同じぐらい."],
["この部屋は台所（　）広いです。","が",["を","に","へ"],"Topic は Feature が Adjective."],
["この部屋は三つの部屋の（　）いちばん新しいです。","中で",["より","ずっと","ほう"],"Group の中で いちばん."],
["サッカーのほうが（　）人気があります。","ずっと",["いちばん","すぎ","どちら"],"ずっと = much more."],
["お酒を飲み（　）と、頭が痛くなります。","すぎる",["すぎ","すぎて","すぎた"],"Before と use the dictionary form: すぎる."],
["琵琶湖は日本（　）いちばん大きい湖です。","で",["より","が","に"],"Group + で/の中で + いちばん."],
["“A は B より 大きいです” means:","A is bigger than B",["B is bigger than A","A and B are equal","A is the biggest of all"],"A は B より = A is more than B."],
["一年の中で（　）がいちばん雨が多いですか。","いつ",["どこ","だれ","なに"],"A question about time uses いつ."]],
c16:[["今日は母の誕生日（　）んです。","な",["の","だ","で"],"Noun + なんです."],
["私の趣味は映画を見る（　）です。","こと",["もの","ところ","とき"],"Verb (plain) + こと turns a verb into a noun."],

const mk=(q,a,w,e)=>{const o=sh([a,...w]);return{q,o,a:o.indexOf(a),e}};
function gen17(){const v=V[Math.floor(Math.random()*V.length)],neg=Math.random()<.5,a=v[neg?3:2];return mk(`Choose the ${neg?"negative":"affirmative"} potential form of 「${v[0]}」.`,a,sh(V.flatMap(x=>[x[2],x[3]]).filter(x=>x!==a)).slice(0,3),`${v[4]}: ${v[0]} → ${v[2]} / ${v[3]}`)}
function build(ch){const bk=k=>sh(B[k]).map(x=>mk(...x)),rd=k=>{const r=RD[k][Math.floor(Math.random()*RD[k].length)];return r[1].map(x=>({...mk(...x),p:r[0]}))};
let q;if(ch==="all")q=sh([...bk("c15").slice(0,2),...bk("c16").slice(0,2),...bk("c17").slice(0,2),gen17(),gen17()]).concat(rd(["c15","c16","c17"][Math.random()*3|0]));
else if(ch==="c17")q=sh([...bk(ch).slice(0,5),gen17(),gen17(),gen17()]).concat(rd(ch));
else q=bk(ch).slice(0,8).concat(rd(ch));
return{ch,qs:q,ans:[],done:false}}
let T=null;
const NM={c15:"Chapter 15",c16:"Chapter 16",c17:"Chapter 17",all:"All chapters"};
function ans(i,j){if(T.done)return;T.ans[i]=j;render()}
function mock(){
if(!T)return `<h2 style="margin:6px 0 2px">📝 Mock test</h2><p class="note">10 questions per test: grammar and reading. Every test picks and shuffles new questions.</p>`+[["c15","⚖️ Chapter 15 comparisons"],["c16","💬 Chapter 16 explaining and requests"],["c17","💪 Chapter 17 potential form"],["all","🎲 All chapters mixed"]].map(([k,l])=>`<button class="pick" onclick="T=build('${k}');render();scrollTo(0,0)">${l}</button>`).join("");
const qs=T.qs;let last="",sc=qs.filter((x,i)=>T.ans[i]===x.a).length,n=T.ans.filter(x=>x!==undefined).length;
const top=T.done?`<div class="card"><h2>🎯 Score: ${sc} / ${qs.length}</h2><p class="note">${sc===qs.length?"Perfect! 🎉":sc>=qs.length*.7?"Nice work! Review the ❌ items below.":"Keep going: read the explanations and try a new test."}</p></div>`:`<p class="note">${NM[T.ch]} · answered ${n} / ${qs.length}</p>`;
const body=qs.map((x,i)=>{const ps=x.p&&x.p!==last?(last=x.p,`<div class="card"><h2>📖 Reading</h2><p class="jp" style="font-size:1.1rem;line-height:2.2">${x.p}</p></div>`):"";
return ps+`<div class="card"><p><b>${i+1}.</b> ${x.q}</p><div class="opts mopts">${x.o.map((o,j)=>`<button class="${T.done?(j===x.a?"ok":T.ans[i]===j?"bad":""):(T.ans[i]===j?"sel":"")}" ${T.done?"disabled":""} onclick="ans(${i},${j})">${o}</button>`).join("")}</div>${T.done?`<p class="note">${T.ans[i]===x.a?"✅":"❌"} ${x.e}</p>`:""}</div>`}).join("");
const foot=T.done?`<button class="btn" onclick="T=build(T.ch);render();scrollTo(0,0)">New test (new questions)</button> <button class="btn" onclick="T=null;render();scrollTo(0,0)">Change chapter</button>`:`<button class="btn" onclick="T.done=true;render();scrollTo(0,0)">Submit test</button>`;
return top+body+foot}

function ruby(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
ns.forEach(n=>{const t=n.nodeValue;if(!/[\u4e00-\u9fff]/.test(t)||n.parentNode.closest("ruby,script,style"))return;const f=document.createDocumentFragment();let i=0,b="";
while(i<t.length){const h=FR.find(([k,tl])=>t.startsWith(k,i)&&(!tl||t.startsWith(tl,i+k.length)));
if(h){if(b){f.append(b);b=""}const r=document.createElement("ruby");r.append(h[0]);const x=document.createElement("rt");x.textContent=h[2];r.append(x);f.append(r);i+=h[0].length}else b+=t[i++]}
